<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>LOVE TNPSC - Quiz Studio</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Mukta+Malar:wght@500;700;800&family=Teko:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: radial-gradient(circle at 50% 20%, #171b38 0%, #080b18 100%);
      font-family: 'Mukta Malar', sans-serif;
      color: #ffffff;
    }

    .digital-num {
      font-family: 'Teko', sans-serif;
      line-height: 1;
    }

    /* Transition Animations */
    .fade-out-left {
      opacity: 0;
      transform: translateX(-40px);
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .fade-in-right {
      animation: slideInFromRight 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes slideInFromRight {
      from {
        opacity: 0;
        transform: translateX(40px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .correct-highlight {
      background: linear-gradient(135deg, #059669 0%, #10b981 100%) !important;
      border-color: #34d399 !important;
      box-shadow: 0 0 25px rgba(16, 185, 129, 0.7), inset 0 0 15px rgba(255, 255, 255, 0.3) !important;
      animation: correctPulse 0.5s ease-out;
    }

    @keyframes correctPulse {
      0% { transform: scale(0.97); }
      50% { transform: scale(1.02); }
      100% { transform: scale(1); }
    }

    .check-badge {
      animation: popCheck 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes popCheck {
      0% { transform: scale(0) rotate(-45deg); opacity: 0; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
  </style>
</head>
<body class="flex items-center justify-center p-1 sm:p-2">

  <!-- Audio Elements -->
  <audio id="tickAudio" preload="auto" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>
  <audio id="bellAudio" preload="auto" src="https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3"></audio>

  <div class="w-full h-full max-w-[1400px] flex flex-col justify-between p-2 sm:p-3 relative overflow-hidden">

    <!-- Header Bar -->
    <header class="flex items-center justify-between gap-2 shrink-0 h-9 sm:h-10">
      <div class="bg-gradient-to-r from-amber-500/20 to-amber-700/10 border border-amber-500/40 rounded-lg px-2.5 py-1 flex items-center gap-1.5 shadow-sm">
        <span class="text-amber-400 font-bold text-xs sm:text-sm tracking-wide">கேள்வி</span>
        <span id="currentQNum" class="text-white font-black text-sm sm:text-base digital-num">01</span>
        <span class="text-amber-300/60 text-xs">/</span>
        <span id="totalQNum" class="text-amber-300/80 text-xs sm:text-sm digital-num">50</span>
      </div>

      <!-- 5s Circular Timer with Hide / Show toggle capability -->
      <div id="timerContainer" class="flex items-center gap-2 bg-[#121833]/90 border border-amber-500/40 rounded-full px-3 py-0.5 shadow-md transition-all duration-300">
        <div class="relative w-7 h-7 flex items-center justify-center">
          <svg class="w-full h-full -rotate-90" viewBox="0 0 36 36">
            <path class="text-slate-800" stroke-width="4" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
            <path id="timerCircle" class="text-amber-400 transition-all duration-300" stroke-width="4.5" stroke-dasharray="100, 100" stroke-linecap="round" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
          </svg>
          <span id="timerText" class="absolute text-amber-300 font-black text-sm digital-num">5</span>
        </div>
        <span class="text-amber-300 font-bold text-xs hidden sm:inline">வினாடி</span>
      </div>

      <div class="flex items-center gap-1.5">
        <!-- Toggle Timer Visibility Button -->
        <button id="toggleTimerBtn" onclick="toggleTimerVisibility()" title="டைமரை மறை/காட்டு" class="bg-slate-800/80 hover:bg-slate-700 border border-slate-600/40 text-slate-200 text-xs font-semibold px-2 py-1 rounded-md flex items-center gap-1 shadow-sm transition">
          <span id="timerToggleIcon">👁️</span>
          <span id="timerToggleText" class="hidden sm:inline">டைமர்</span>
        </button>
        <button onclick="openEditor()" class="bg-indigo-900/60 hover:bg-indigo-800 border border-indigo-400/30 text-indigo-200 text-xs font-semibold px-2 py-1 rounded-md flex items-center gap-1 shadow-sm transition">
          <span>➕</span>
          <span class="hidden sm:inline">கேள்விகள் சேர்</span>
        </button>
        <div class="flex items-center gap-1 bg-gradient-to-r from-pink-600/30 to-purple-600/30 border border-pink-500/40 px-2 py-1 rounded-md">
          <span class="bg-pink-600 text-[10px] font-black px-1 rounded text-white leading-tight">GK</span>
          <span class="text-white font-extrabold text-xs tracking-wider">LOVE TNPSC</span>
        </div>
      </div>
    </header>

    <!-- Animated Content Wrapper -->
    <div id="quizContentArea" class="w-full flex-1 flex flex-col justify-between my-1 overflow-hidden">
      <!-- Question Container -->
      <main class="w-full shrink-0 my-1">
        <div class="bg-gradient-to-b from-[#162044] to-[#0d142e] border-2 border-amber-500/80 rounded-xl px-3 py-2 sm:py-2.5 shadow-lg flex items-center justify-center text-center">
          <h1 id="questionText" class="text-white font-extrabold text-xs sm:text-base md:text-lg leading-snug drop-shadow-sm">
            இந்திய அரசியலமைப்பின் பெரும்பகுதி எந்தச் சட்டத்திலிருந்து பெறப்பட்டது?
          </h1>
        </div>
      </main>

      <!-- 4 Options Grid (A, B, C, D) -->
      <section class="grid grid-cols-2 gap-1.5 sm:gap-2 flex-1 my-1 overflow-hidden">
        <!-- Option A -->
        <div id="optContainer0" class="opt-card bg-[#111833]/90 border-2 border-[#263769] rounded-lg p-1.5 sm:p-2 flex items-center justify-between gap-1 shadow transition">
          <div class="flex items-center gap-1.5 sm:gap-2 flex-1 min-w-0">
            <span class="bg-amber-500 text-slate-950 font-black text-[11px] sm:text-xs px-1.5 py-0.5 rounded shrink-0">A</span>
            <span id="optText0" class="text-white font-bold text-[11px] sm:text-xs md:text-sm leading-tight break-words whitespace-normal flex-1">Option A</span>
          </div>
          <div id="badge0" class="hidden shrink-0"></div>
        </div>

        <!-- Option B -->
        <div id="optContainer1" class="opt-card bg-[#111833]/90 border-2 border-[#263769] rounded-lg p-1.5 sm:p-2 flex items-center justify-between gap-1 shadow transition">
          <div class="flex items-center gap-1.5 sm:gap-2 flex-1 min-w-0">
            <span class="bg-amber-500 text-slate-950 font-black text-[11px] sm:text-xs px-1.5 py-0.5 rounded shrink-0">B</span>
            <span id="optText1" class="text-white font-bold text-[11px] sm:text-xs md:text-sm leading-tight break-words whitespace-normal flex-1">Option B</span>
          </div>
          <div id="badge1" class="hidden shrink-0"></div>
        </div>

        <!-- Option C -->
        <div id="optContainer2" class="opt-card bg-[#111833]/90 border-2 border-[#263769] rounded-lg p-1.5 sm:p-2 flex items-center justify-between gap-1 shadow transition">
          <div class="flex items-center gap-1.5 sm:gap-2 flex-1 min-w-0">
            <span class="bg-amber-500 text-slate-950 font-black text-[11px] sm:text-xs px-1.5 py-0.5 rounded shrink-0">C</span>
            <span id="optText2" class="text-white font-bold text-[11px] sm:text-xs md:text-sm leading-tight break-words whitespace-normal flex-1">Option C</span>
          </div>
          <div id="badge2" class="hidden shrink-0"></div>
        </div>

        <!-- Option D -->
        <div id="optContainer3" class="opt-card bg-[#111833]/90 border-2 border-[#263769] rounded-lg p-1.5 sm:p-2 flex items-center justify-between gap-1 shadow transition">
          <div class="flex items-center gap-1.5 sm:gap-2 flex-1 min-w-0">
            <span class="bg-amber-500 text-slate-950 font-black text-[11px] sm:text-xs px-1.5 py-0.5 rounded shrink-0">D</span>
            <span id="optText3" class="text-white font-bold text-[11px] sm:text-xs md:text-sm leading-tight break-words whitespace-normal flex-1">Option D</span>
          </div>
          <div id="badge3" class="hidden shrink-0"></div>
        </div>
      </section>
    </div>

    <!-- Bottom Trigger Bar -->
    <footer class="shrink-0 flex items-center justify-center pt-1 pb-1">
      <button id="startTimerBtn" onclick="triggerQuizAction()" class="w-full sm:w-2/3 max-w-md bg-gradient-to-r from-amber-500 via-amber-400 to-amber-500 hover:from-amber-400 hover:to-amber-300 text-slate-950 font-black text-xs sm:text-sm py-1.5 sm:py-2 px-4 rounded-xl shadow-lg transform active:scale-95 transition flex items-center justify-center gap-2 border border-amber-200/60">
        <span class="text-sm">⏱️</span>
        <span id="btnLabel">டைமர் தொடங்கு (5 விநாடி)</span>
      </button>
    </footer>

  </div>

  <!-- Question Upload Modal -->
  <div id="editorModal" class="hidden fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-3">
    <div class="bg-[#0f152d] border border-amber-500/40 rounded-xl p-4 w-full max-w-lg shadow-2xl flex flex-col gap-3 max-h-[90vh]">
      <div class="flex justify-between items-center pb-2 border-b border-slate-700">
        <h2 class="text-amber-400 font-bold text-sm sm:text-base">புதிய வினாக்களைப் பதிவேற்று (Bulk Upload)</h2>
        <button onclick="closeEditor()" class="text-slate-400 hover:text-white text-lg">✕</button>
      </div>
      <p class="text-xs text-slate-300">50 வினாக்களின் JSON குறியீட்டை கீழே உள்ள பெட்டியில் ஒட்டவும் (Paste):</p>
      <textarea id="jsonInput" class="w-full h-44 bg-[#080c1d] border border-slate-700 rounded-lg p-2 text-xs font-mono text-emerald-400 focus:outline-none focus:border-amber-400" placeholder="Paste JSON here..."></textarea>
      <div class="flex gap-2 justify-end pt-1">
        <button onclick="closeEditor()" class="bg-slate-800 text-slate-300 text-xs px-3 py-1.5 rounded-lg">ரத்து</button>
        <button onclick="applyNewQuestions()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs px-4 py-1.5 rounded-lg shadow">புதுப்பி & ஏற்று</button>
      </div>
    </div>
  </div>

  <script>
    let quizData = [
      {"question": "இந்திய அரசியலமைப்பின் பெரும்பகுதி எந்தச் சட்டத்திலிருந்து பெறப்பட்டது?", "options": ["1919 ஆம் ஆண்டு சட்டம்", "1935 ஆம் ஆண்டு இந்திய அரசுச் சட்டம்", "1909 ஆம் ஆண்டு மின்டோ-மார்லி சட்டம்", "1947 இந்திய சுதந்திரச் சட்டம்"], "correct": 1},
      {"question": "நாடாளுமன்ற ஆட்சி முறை (Parliamentary System) எந்த நாட்டின் அரசியலமைப்பிலிருந்து பெறப்பட்டது?", "options": ["அமெரிக்கா", "பிரிட்டன்", "அயர்லாந்து", "கனடா"], "correct": 1},
      {"question": "அடிப்படை உரிமைகள் (Fundamental Rights) எந்த நாட்டின் அரசியலமைப்பிலிருந்து பெறப்பட்டன?", "options": ["பிரிட்டன்", "சோவியத் யூனியன் (USSR)", "அமெரிக்கா (USA)", "பிரான்ஸ்"], "correct": 2},
      {"question": "அரசு நெறிமுறையுறுத்தும் கோட்பாடுகள் (DPSP) எந்த நாட்டிலிருந்து பெறப்பட்டது?", "options": ["அயர்லாந்து", "கனடா", "ஆஸ்திரேலியா", "ஜெர்மனி"], "correct": 0},
      {"question": "நீதித்துறை மறுஆய்வு (Judicial Review) எந்த நாட்டின் அரசியலமைப்பிலிருந்து எடுக்கப்பட்டது?", "options": ["பிரிட்டன்", "அமெரிக்கா", "ஆஸ்திரேலியா", "ஜெர்மனி"], "correct": 1}
    ];

    let currentIndex = 0;
    let timerRunning = false;
    let countdownVal = 5;
    let timerInterval = null;
    let autoNextTimeout = null;
    let isTimerHidden = false;

    const tickAudio = document.getElementById('tickAudio');
    const bellAudio = document.getElementById('bellAudio');

    function unlockAudio() {
      tickAudio.play().then(() => {
        tickAudio.pause();
        tickAudio.currentTime = 0;
      }).catch(() => {});
      bellAudio.play().then(() => {
        bellAudio.pause();
        bellAudio.currentTime = 0;
      }).catch(() => {});
    }

    function playTickSound() {
      try {
        tickAudio.currentTime = 0;
        tickAudio.play();
      } catch (e) {}
    }

    function playDingSound() {
      try {
        bellAudio.currentTime = 0;
        bellAudio.play();
      } catch (e) {}
    }

    // Toggle Hide/Show Timer Display
    function toggleTimerVisibility() {
      isTimerHidden = !isTimerHidden;
      const timerContainer = document.getElementById('timerContainer');
      const toggleText = document.getElementById('timerToggleText');
      const toggleIcon = document.getElementById('timerToggleIcon');

      if (isTimerHidden) {
        timerContainer.classList.add('opacity-0', 'pointer-events-none');
        toggleIcon.textContent = '👁️‍🗨️';
        toggleText.textContent = 'டைமர் காட்டு';
      } else {
        timerContainer.classList.remove('opacity-0', 'pointer-events-none');
        toggleIcon.textContent = '👁️';
        toggleText.textContent = 'டைமர் மறை';
      }
    }

    function renderQuestion(withTransition = false) {
      clearTimeout(autoNextTimeout);
      clearInterval(timerInterval);
      timerRunning = false;
      countdownVal = 5;

      const contentArea = document.getElementById('quizContentArea');

      const updateData = () => {
        const q = quizData[currentIndex];
        document.getElementById('currentQNum').textContent = String(currentIndex + 1).padStart(2, '0');
        document.getElementById('totalQNum').textContent = String(quizData.length).padStart(2, '0');
        document.getElementById('questionText').textContent = q.question;

        document.getElementById('timerText').textContent = '5';
        document.getElementById('timerCircle').setAttribute('stroke-dasharray', '100, 100');
        document.getElementById('timerCircle').className.baseVal = 'text-amber-400';

        const btn = document.getElementById('startTimerBtn');
        btn.disabled = false;
        btn.classList.remove('opacity-50');
        document.getElementById('btnLabel').textContent = 'டைமர் தொடங்கு (5 விநாடி)';

        for (let i = 0; i < 4; i++) {
          const optBox = document.getElementById(`optContainer${i}`);
          const optTxt = document.getElementById(`optText${i}`);
          const badge = document.getElementById(`badge${i}`);

          optTxt.textContent = q.options[i];
          optBox.className = 'opt-card bg-[#111833]/90 border-2 border-[#263769] rounded-lg p-1.5 sm:p-2 flex items-center justify-between gap-1 shadow transition';
          badge.innerHTML = '';
          badge.className = 'hidden shrink-0';
        }

        if (withTransition) {
          contentArea.classList.remove('fade-out-left');
          contentArea.classList.add('fade-in-right');
          setTimeout(() => {
            contentArea.classList.remove('fade-in-right');
          }, 400);
        }
      };

      if (withTransition) {
        contentArea.classList.add('fade-out-left');
        setTimeout(updateData, 300);
      } else {
        updateData();
      }
    }

    function triggerQuizAction() {
      unlockAudio();
      if (timerRunning) return;
      startCountdown();
    }

    function startCountdown() {
      timerRunning = true;
      countdownVal = 5;
      const btn = document.getElementById('startTimerBtn');
      btn.disabled = true;
      btn.classList.add('opacity-50');
      document.getElementById('btnLabel').textContent = 'நேரம் ஓடுகிறது...';

      playTickSound();
      updateTimerDisplay();

      timerInterval = setInterval(() => {
        countdownVal--;
        if (countdownVal > 0) {
          playTickSound();
          updateTimerDisplay();
        } else {
          clearInterval(timerInterval);
          updateTimerDisplay();
          revealAnswer();
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      document.getElementById('timerText').textContent = countdownVal;
      const dashoffset = 100 - (countdownVal / 5) * 100;
      document.getElementById('timerCircle').setAttribute('stroke-dasharray', `${100 - dashoffset}, 100`);
      if (countdownVal <= 2) {
        document.getElementById('timerCircle').className.baseVal = 'text-rose-500';
      }
    }

    function revealAnswer() {
      playDingSound();
      const q = quizData[currentIndex];
      const correctIdx = q.correct;
      const correctCard = document.getElementById(`optContainer${correctIdx}`);
      const correctBadge = document.getElementById(`badge${correctIdx}`);

      correctCard.className = 'opt-card correct-highlight rounded-lg p-1.5 sm:p-2 flex items-center justify-between gap-1 shadow-lg transition';
      correctBadge.innerHTML = `<span class="bg-white text-emerald-700 font-black rounded-full w-5 h-5 sm:w-6 sm:h-6 flex items-center justify-center text-xs sm:text-sm shadow check-badge">✔</span>`;
      correctBadge.className = 'shrink-0 block';

      document.getElementById('btnLabel').textContent = 'சரியான விடை காட்டப்பட்டது!';

      // 3 Seconds Delay -> Smooth Slide Transition to next question
      autoNextTimeout = setTimeout(() => {
        if (currentIndex < quizData.length - 1) {
          currentIndex++;
          renderQuestion(true);
        } else {
          document.getElementById('btnLabel').textContent = 'அனைத்து கேள்விகளும் முடிந்தது! 🎉';
        }
      }, 3000);
    }

    function openEditor() {
      document.getElementById('editorModal').classList.remove('hidden');
    }
    function closeEditor() {
      document.getElementById('editorModal').classList.add('hidden');
    }

    function applyNewQuestions() {
      const raw = document.getElementById('jsonInput').value.trim();
      if (!raw) return;
      try {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed) && parsed.length > 0) {
          quizData = parsed;
          currentIndex = 0;
          closeEditor();
          renderQuestion(true);
        }
      } catch (err) {
        alert('JSON error! Formatta check pannunga.');
      }
    }

    window.onload = () => {
      renderQuestion(false);
      document.body.addEventListener('touchstart', unlockAudio, { once: true });
      document.body.addEventListener('click', unlockAudio, { once: true });
    };
  </script>
</body>
</html>
