<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>LOVE TNPSC - White Studio Image Quiz</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Mukta+Malar:wght@600;700;800&family=Teko:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #ffffff;
      font-family: 'Mukta Malar', sans-serif;
      color: #0b1536;
    }

    .digital-num {
      font-family: 'Teko', sans-serif;
      line-height: 1;
    }

    /* Pop-Up Zoom In Animation */
    .pop-exit {
      opacity: 0;
      transform: scale(0.92);
      transition: all 0.2s cubic-bezier(0.4, 0, 1, 1);
    }

    .pop-enter {
      animation: popZoomIn 0.38s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes popZoomIn {
      0% {
        opacity: 0;
        transform: scale(0.85);
      }
      75% {
        opacity: 1;
        transform: scale(1.02);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Correct Answer Green Highlight on White Screen */
    .correct-highlight {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%) !important;
      color: #ffffff !important;
      border-color: #047857 !important;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.45) !important;
      animation: correctPulse 0.4s ease-out;
    }

    .correct-highlight span {
      color: #ffffff !important;
    }

    @keyframes correctPulse {
      0% { transform: scale(0.98); }
      50% { transform: scale(1.02); }
      100% { transform: scale(1); }
    }

    .check-badge {
      animation: popCheck 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes popCheck {
      0% { transform: scale(0) rotate(-45deg); opacity: 0; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
  </style>
</head>
<body class="flex items-center justify-center p-2 sm:p-4 bg-white">

  <div class="w-full h-full max-w-[1400px] flex flex-col justify-between relative overflow-hidden bg-white">

    <!-- Top Navigation Bar -->
    <header class="flex items-center justify-between gap-2 shrink-0 h-10 border-b border-slate-200 pb-2">
      <div class="flex items-center gap-2">
        <span class="bg-indigo-900 text-white font-extrabold text-xs px-2.5 py-1 rounded-md tracking-wider">LOVE TNPSC</span>
        <div class="bg-slate-100 border border-slate-300 rounded-md px-2 py-0.5 flex items-center gap-1 font-bold text-xs text-slate-700">
          <span>கேள்வி:</span>
          <span id="currentQNum" class="text-indigo-900 font-black text-sm digital-num">01</span>
          <span>/</span>
          <span id="totalQNum" class="digital-num">10</span>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button id="toggleTimerBtn" onclick="toggleTimerVisibility()" class="bg-slate-100 hover:bg-slate-200 border border-slate-300 text-slate-700 text-xs font-bold px-2 py-1 rounded-md shadow-sm transition">
          <span id="timerToggleIcon">👁️</span>
          <span id="timerToggleText" class="hidden sm:inline">டைமர்</span>
        </button>
        <button onclick="openEditor()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-3 py-1 rounded-md shadow transition flex items-center gap-1">
          <span>➕</span>
          <span>கேள்விகள் சேர்</span>
        </button>
      </div>
    </header>

    <!-- Quiz Content Container (Animated Pop-Up) -->
    <div id="quizContentArea" class="w-full flex-1 flex flex-col justify-between py-2 overflow-hidden pop-enter">
      
      <!-- Top Question Title -->
      <main class="w-full shrink-0 my-1">
        <h1 id="questionText" class="text-[#0e1d52] font-black text-lg sm:text-2xl md:text-3xl leading-snug drop-shadow-xs">
          Q) சிப்ஸ் பையில் எந்த வாயு நிரப்பப்படுகிறது?
        </h1>
      </main>

      <!-- Middle 2-Column Section: Left Options, Right Related Image -->
      <section class="grid grid-cols-1 md:grid-cols-2 gap-4 flex-1 items-center overflow-hidden my-1">
        
        <!-- Left Side: 4 Options (a, b, c, d) -->
        <div class="flex flex-col gap-2.5 justify-center flex-1">
          
          <!-- Option A -->
          <div id="optContainer0" class="opt-card border-2 border-slate-200 hover:border-slate-300 bg-slate-50/80 rounded-xl px-4 py-2 flex items-center justify-between shadow-xs transition">
            <div class="flex items-center gap-3">
              <span class="text-[#0e1d52] font-black text-base sm:text-lg">a)</span>
              <span id="optText0" class="text-[#0e1d52] font-bold text-base sm:text-xl">நைட்ரஜன்</span>
            </div>
            <div id="badge0" class="hidden shrink-0"></div>
          </div>

          <!-- Option B -->
          <div id="optContainer1" class="opt-card border-2 border-slate-200 hover:border-slate-300 bg-slate-50/80 rounded-xl px-4 py-2 flex items-center justify-between shadow-xs transition">
            <div class="flex items-center gap-3">
              <span class="text-[#0e1d52] font-black text-base sm:text-lg">b)</span>
              <span id="optText1" class="text-[#0e1d52] font-bold text-base sm:text-xl">ஹைட்ரஜன்</span>
            </div>
            <div id="badge1" class="hidden shrink-0"></div>
          </div>

          <!-- Option C -->
          <div id="optContainer2" class="opt-card border-2 border-slate-200 hover:border-slate-300 bg-slate-50/80 rounded-xl px-4 py-2 flex items-center justify-between shadow-xs transition">
            <div class="flex items-center gap-3">
              <span class="text-[#0e1d52] font-black text-base sm:text-lg">c)</span>
              <span id="optText2" class="text-[#0e1d52] font-bold text-base sm:text-xl">ஆக்சிஜன்</span>
            </div>
            <div id="badge2" class="hidden shrink-0"></div>
          </div>

          <!-- Option D -->
          <div id="optContainer3" class="opt-card border-2 border-slate-200 hover:border-slate-300 bg-slate-50/80 rounded-xl px-4 py-2 flex items-center justify-between shadow-xs transition">
            <div class="flex items-center gap-3">
              <span class="text-[#0e1d52] font-black text-base sm:text-lg">d)</span>
              <span id="optText3" class="text-[#0e1d52] font-bold text-base sm:text-xl">ஆர்கான்</span>
            </div>
            <div id="badge3" class="hidden shrink-0"></div>
          </div>

        </div>

        <!-- Right Side: Clean Related Image Frame -->
        <div class="flex items-center justify-center h-full max-h-[280px] p-2 bg-white rounded-2xl">
          <img id="quizImage" src="https://images.unsplash.com/photo-1566478989037-eec170784d0b?w=600&auto=format&fit=crop&q=80" alt="Question Image" class="max-h-full max-w-full object-contain drop-shadow-md rounded-lg transition-all duration-300">
        </div>

      </section>

    </div>

    <!-- Bottom Action Bar & Golden Metallic 5s Timer (Bottom Right) -->
    <footer class="shrink-0 flex items-center justify-between pt-2 border-t border-slate-100">
      
      <!-- Main Trigger Button -->
      <button id="startTimerBtn" onclick="triggerQuizAction()" class="bg-gradient-to-r from-indigo-700 to-indigo-900 hover:from-indigo-800 hover:to-indigo-950 text-white font-extrabold text-sm sm:text-base py-2.5 px-6 rounded-xl shadow-md transform active:scale-95 transition flex items-center gap-2">
        <span>⏱️</span>
        <span id="btnLabel">டைமர் தொடங்கு (5 விநாடி)</span>
      </button>

      <!-- 5s Circular Dial (Matching your screenshot) -->
      <div id="timerContainer" class="flex items-center gap-2 transition-all duration-300">
        <div class="relative w-12 h-12 flex items-center justify-center rounded-full bg-gradient-to-b from-amber-300 via-amber-500 to-amber-700 p-1 shadow-lg border-2 border-amber-200">
          <div class="w-full h-full bg-amber-100 rounded-full flex items-center justify-center shadow-inner">
            <span id="timerText" class="text-amber-900 font-black text-2xl digital-num">5</span>
          </div>
        </div>
      </div>

    </footer>

  </div>

  <!-- Bulk Question Upload Modal -->
  <div id="editorModal" class="hidden fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-3">
    <div class="bg-white border border-slate-300 rounded-2xl p-4 w-full max-w-lg shadow-2xl flex flex-col gap-3 max-h-[90vh]">
      <div class="flex justify-between items-center pb-2 border-b border-slate-200">
        <h2 class="text-indigo-950 font-bold text-base">புதிய வினாக்களைப் பதிவேற்று (Bulk Upload with Images)</h2>
        <button onclick="closeEditor()" class="text-slate-400 hover:text-slate-700 text-lg font-bold">✕</button>
      </div>
      <p class="text-xs text-slate-600">கேள்விகள், ஆப்ஷன்கள் மற்றும் படங்களின் லிங்க் (URL) அடங்கிய JSON குறியீட்டை கீழே ஒட்டவும்:</p>
      <textarea id="jsonInput" class="w-full h-48 bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-xs font-mono text-slate-800 focus:outline-none focus:border-indigo-600" placeholder="Paste JSON here..."></textarea>
      <div class="flex gap-2 justify-end pt-1">
        <button onclick="closeEditor()" class="bg-slate-200 text-slate-700 text-xs px-3 py-1.5 rounded-lg font-bold">ரத்து</button>
        <button onclick="applyNewQuestions()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs px-4 py-1.5 rounded-lg shadow">புதுப்பி & ஏற்று</button>
      </div>
    </div>
  </div>

  <script>
    // Sample Pre-loaded Image Quiz Data
    let quizData = [
      {
        "question": "Q) சிப்ஸ் பையில் எந்த வாயு நிரப்பப்படுகிறது?",
        "image": "https://images.unsplash.com/photo-1566478989037-eec170784d0b?w=600&auto=format&fit=crop&q=80",
        "options": ["நைட்ரஜன்", "ஹைட்ரஜன்", "ஆக்சிஜன்", "ஆர்கான்"],
        "correct": 0
      },
      {
        "question": "Q) கூகுள் (Google) எந்த நாட்டின் நிறுவனம்?",
        "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/2/2f/Google_2015_logo.svg/800px-Google_2015_logo.svg.png",
        "options": ["இந்தியா", "அமெரிக்கா", "ஜப்பான்", "சீனா"],
        "correct": 1
      },
      {
        "question": "Q) இந்திய விண்வெளி ஆய்வு மையத்தின் (ISRO) தலைமையகம் எங்குள்ளது?",
        "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/b/bd/ISRO_Logo.svg/800px-ISRO_Logo.svg.png",
        "options": ["சென்னை", "டெல்லி", "பெங்களூரு", "மும்பை"],
        "correct": 2
      }
    ];

    let currentIndex = 0;
    let timerRunning = false;
    let countdownVal = 5;
    let timerInterval = null;
    let autoNextTimeout = null;
    let isTimerHidden = false;

    // Zero Latency Web Audio Setup
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    // High Tension Woodblock Tick Sound
    function playTickSound(remainingSeconds) {
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        const step = 6 - remainingSeconds;
        const baseFreq = 700 + (step * 85);

        const osc1 = ctx.createOscillator();
        const gain1 = ctx.createGain();
        osc1.type = 'triangle';
        osc1.frequency.setValueAtTime(baseFreq, now);
        osc1.frequency.exponentialRampToValueAtTime(140, now + 0.045);
        gain1.gain.setValueAtTime(0.4, now);
        gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.045);
        osc1.connect(gain1);
        gain1.connect(ctx.destination);
        osc1.start(now);
        osc1.stop(now + 0.045);

        const osc2 = ctx.createOscillator();
        const gain2 = ctx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(baseFreq * 1.8, now);
        osc2.frequency.exponentialRampToValueAtTime(baseFreq * 0.4, now + 0.035);
        gain2.gain.setValueAtTime(0.2, now);
        gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.035);
        osc2.connect(gain2);
        gain2.connect(ctx.destination);
        osc2.start(now);
        osc2.stop(now + 0.035);
      } catch (e) {}
    }

    // Gentle 0.4s Answer Chime
    function playDingSound() {
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.08);

        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.4);
      } catch (e) {}
    }

    function toggleTimerVisibility() {
      isTimerHidden = !isTimerHidden;
      const timerContainer = document.getElementById('timerContainer');
      const toggleText = document.getElementById('timerToggleText');
      const toggleIcon = document.getElementById('timerToggleIcon');

      if (isTimerHidden) {
        timerContainer.classList.add('opacity-0', 'pointer-events-none');
        toggleIcon.textContent = '👁️‍🗨️';
        toggleText.textContent = 'டைமர் காட்டு';
      } else {
        timerContainer.classList.remove('opacity-0', 'pointer-events-none');
        toggleIcon.textContent = '👁️';
        toggleText.textContent = 'டைமர் மறை';
      }
    }

    // Question Rendering with Pop-Up Zoom
    function renderQuestion(withTransition = false) {
      clearTimeout(autoNextTimeout);
      clearInterval(timerInterval);
      timerRunning = false;
      countdownVal = 5;

      const contentArea = document.getElementById('quizContentArea');

      const applyData = () => {
        const q = quizData[currentIndex];
        document.getElementById('currentQNum').textContent = String(currentIndex + 1).padStart(2, '0');
        document.getElementById('totalQNum').textContent = String(quizData.length).padStart(2, '0');
        document.getElementById('questionText').textContent = q.question;
        
        // Update Image
        const imgElem = document.getElementById('quizImage');
        imgElem.src = q.image || "https://images.unsplash.com/photo-1566478989037-eec170784d0b?w=600&auto=format&fit=crop&q=80";

        document.getElementById('timerText').textContent = '5';

        const btn = document.getElementById('startTimerBtn');
        btn.disabled = false;
        btn.classList.remove('opacity-50');
        document.getElementById('btnLabel').textContent = 'டைமர் தொடங்கு (5 விநாடி)';

        for (let i = 0; i < 4; i++) {
          const optBox = document.getElementById(`optContainer${i}`);
          const optTxt = document.getElementById(`optText${i}`);
          const badge = document.getElementById(`badge${i}`);

          optTxt.textContent = q.options[i];
          optBox.className = 'opt-card border-2 border-slate-200 hover:border-slate-300 bg-slate-50/80 rounded-xl px-4 py-2 flex items-center justify-between shadow-xs transition';
          badge.innerHTML = '';
          badge.className = 'hidden shrink-0';
        }

        if (withTransition) {
          contentArea.classList.remove('pop-exit');
          contentArea.classList.add('pop-enter');
          setTimeout(() => {
            contentArea.classList.remove('pop-enter');
          }, 380);
        }
      };

      if (withTransition) {
        contentArea.classList.add('pop-exit');
        setTimeout(applyData, 200);
      } else {
        applyData();
      }
    }

    function triggerQuizAction() {
      const ctx = getAudioContext();
      if (ctx.state === 'suspended') {
        ctx.resume().then(() => {
          if (!timerRunning) startCountdown();
        });
      } else {
        if (!timerRunning) startCountdown();
      }
    }

    function startCountdown() {
      timerRunning = true;
      countdownVal = 5;
      const btn = document.getElementById('startTimerBtn');
      btn.disabled = true;
      btn.classList.add('opacity-50');
      document.getElementById('btnLabel').textContent = 'நேரம் ஓடுகிறது...';

      playTickSound(countdownVal);
      updateTimerDisplay();

      timerInterval = setInterval(() => {
        countdownVal--;
        if (countdownVal > 0) {
          playTickSound(countdownVal);
          updateTimerDisplay();
        } else {
          clearInterval(timerInterval);
          updateTimerDisplay();
          revealAnswer();
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      document.getElementById('timerText').textContent = countdownVal;
    }

    function revealAnswer() {
      playDingSound();
      const q = quizData[currentIndex];
      const correctIdx = q.correct;
      const correctCard = document.getElementById(`optContainer${correctIdx}`);
      const correctBadge = document.getElementById(`badge${correctIdx}`);

      // Green Highlight Box
      correctCard.className = 'opt-card correct-highlight rounded-xl px-4 py-2 flex items-center justify-between shadow-md transition';
      
      // Green Tick Mark ✔
      correctBadge.innerHTML = `<span class="bg-white text-emerald-600 font-black rounded-full w-6 h-6 flex items-center justify-center text-sm shadow check-badge">✔</span>`;
      correctBadge.className = 'shrink-0 block';

      document.getElementById('btnLabel').textContent = 'சரியான விடை காட்டப்பட்டது!';

      // 3 Seconds Delay -> Next Question
      autoNextTimeout = setTimeout(() => {
        if (currentIndex < quizData.length - 1) {
          currentIndex++;
          renderQuestion(true);
        } else {
          document.getElementById('btnLabel').textContent = 'அனைத்து கேள்விகளும் முடிந்தது! 🎉';
        }
      }, 3000);
    }

    function openEditor() {
      document.getElementById('editorModal').classList.remove('hidden');
    }
    function closeEditor() {
      document.getElementById('editorModal').classList.add('hidden');
    }

    function applyNewQuestions() {
      const raw = document.getElementById('jsonInput').value.trim();
      if (!raw) return;
      try {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed) && parsed.length > 0) {
          quizData = parsed;
          currentIndex = 0;
          closeEditor();
          renderQuestion(true);
        }
      } catch (err) {
        alert('JSON பிழை! சரியான வடிவத்தில் உள்ளதா என சரிபார்க்கவும்.');
      }
    }

    window.onload = () => {
      renderQuestion(false);
      const warmUp = () => {
        getAudioContext();
        document.body.removeEventListener('touchstart', warmUp);
        document.body.removeEventListener('click', warmUp);
      };
      document.body.addEventListener('touchstart', warmUp, { once: true });
      document.body.addEventListener('click', warmUp, { once: true });
    };
  </script>
</body>
</html>
