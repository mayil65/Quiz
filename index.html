<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>LOVE TNPSC - Question Paper Quiz</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <!-- Image block aagama load aaga intha tag mukkiyam -->
  <meta name="referrer" content="no-referrer">
  <link href="https://fonts.googleapis.com/css2?family=Mukta+Malar:wght@600;700;800&family=Teko:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #ffffff !important;
      font-family: 'Mukta Malar', sans-serif;
      color: #0b1536;
    }

    .main-wrapper {
      width: 100%;
      height: 100%;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 10px 20px;
      position: relative;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 6px;
      border-bottom: 1.5px solid #e2e8f0;
      gap: 10px;
      flex-shrink: 0;
    }

    .brand-tag {
      font-weight: 800;
      font-size: 14px;
      color: #1e3a8a;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .start-btn-top {
      background: linear-gradient(135deg, #1e3a8a, #0f172a);
      color: #ffffff;
      font-size: 13px;
      font-weight: 800;
      border: none;
      padding: 6px 16px;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .start-btn-top:disabled {
      opacity: 0.6;
    }

    .btn-edit {
      background: #f1f5f9;
      color: #1e293b;
      border: 1px solid #cbd5e1;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .question-title {
      font-size: 21px;
      font-weight: 800;
      color: #0b1a78;
      line-height: 1.3;
      margin: 6px 0;
      flex-shrink: 0;
    }

    .body-content {
      display: flex;
      flex: 1;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin: 4px 0;
      overflow: hidden;
    }

    .options-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1.2;
      justify-content: center;
    }

    .opt-box {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 19px;
      font-weight: 800;
      color: #000000;
      padding: 5px 12px;
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    .opt-char {
      color: #000000;
      font-weight: 800;
      width: 24px;
    }

    .opt-box.is-correct {
      background-color: #10b981 !important;
      color: #ffffff !important;
      box-shadow: 0 3px 10px rgba(16, 185, 129, 0.4);
    }
    .opt-box.is-correct span {
      color: #ffffff !important;
    }

    .tick-badge {
      margin-left: auto;
      background: #ffffff;
      color: #059669;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 900;
      animation: popTick 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes popTick {
      0% { transform: scale(0); }
      100% { transform: scale(1); }
    }

    .right-column {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      height: 100%;
      max-height: 220px;
    }

    .right-column img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 3px 8px rgba(0,0,0,0.12));
      border-radius: 8px;
    }

    .gold-timer {
      position: absolute;
      bottom: 0px;
      right: 0px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fef08a, #ca8a04 60%, #713f12 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 10px rgba(161, 98, 7, 0.4);
      border: 2px solid #fef9c3;
    }

    .timer-num {
      font-family: 'Teko', sans-serif;
      font-size: 34px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .modal-wrap {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-card {
      background: #ffffff;
      border-radius: 12px;
      padding: 16px;
      width: 90%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .modal-card textarea {
      width: 100%;
      height: 160px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 8px;
      font-size: 12px;
      font-family: monospace;
    }
  </style>
</head>
<body>

  <div class="main-wrapper">

    <div class="header-bar">
      <span class="brand-tag">LOVE TNPSC | <span id="qIndex" style="color: #64748b;">01/50</span></span>
      
      <button id="startBtn" class="start-btn-top" onclick="startTimer()">
        ⏱️ டைமர் தொடங்கு (5 விநாடி)
      </button>

      <button class="btn-edit" onclick="openEditor()">➕ கேள்விகள்</button>
    </div>

    <h1 id="qText" class="question-title">
      Q) 1857 புரட்சியின் முதல் தியாகியாகக் கருதப்படும் சிப்பாய் யார்?
    </h1>

    <div class="body-content">
      
      <div class="options-group">
        <div id="optRow0" class="opt-box">
          <span class="opt-char">a)</span>
          <span id="optText0">மங்கள் பாண்டே</span>
          <div id="tick0"></div>
        </div>
        <div id="optRow1" class="opt-box">
          <span class="opt-char">b)</span>
          <span id="optText1">பகத் சிங்</span>
          <div id="tick1"></div>
        </div>
        <div id="optRow2" class="opt-box">
          <span class="opt-char">c)</span>
          <span id="optText2">தாந்தியா தோபே</span>
          <div id="tick2"></div>
        </div>
        <div id="optRow3" class="opt-box">
          <span class="opt-char">d)</span>
          <span id="optText3">கன்வர் சிங்</span>
          <div id="tick3"></div>
        </div>
      </div>

      <div class="right-column">
        <img id="qImg" src="https://commons.wikimedia.org/wiki/Special:FilePath/Mangal_Pandey.jpg?width=400" alt="Quiz Visual" referrerpolicy="no-referrer">
        <div class="gold-timer">
          <span id="timerVal" class="timer-num">5</span>
        </div>
      </div>

    </div>

  </div>

  <div id="editorModal" class="modal-wrap">
    <div class="modal-card">
      <h3 style="font-size: 15px; font-weight: 800; color: #0b1a78;">JSON-ai paste panna:</h3>
      <textarea id="jsonBox"></textarea>
      <div style="display: flex; gap: 8px; justify-content: flex-end;">
        <button style="padding: 6px 14px; border: none; background: #e2e8f0; border-radius: 6px; font-weight: 700; cursor: pointer;" onclick="closeEditor()">Rathu</button>
        <button style="padding: 6px 14px; border: none; background: #10b981; color: #fff; border-radius: 6px; font-weight: 700; cursor: pointer;" onclick="saveQuestions()">Save</button>
      </div>
    </div>
  </div>

  <script>
    // Direct load aagum path-gal (FilePath API)

    let quizData = [
      {"question": "Q) 1857 பெரும் புரட்சியின் முதல் வெடிப்பு எங்கு நிகழ்ந்தது?", "image": imgMangal, "options": ["மீரட்", "பரக்பூர்", "தில்லி", "கான்பூர்"], "correct": 1},
      {"question": "Q) 1857 புரட்சியின் முதல் தியாகியாகக் கருதப்படும் சிப்பாய் யார்?", "image": imgMangal, "options": ["மங்கள் பாண்டே", "பகத் சிங்", "தாந்தியா தோபே", "கன்வர் சிங்"], "correct": 0},
      {"question": "Q) மங்கள் பாண்டே எந்தப் படைப்பிரிவைச் சேர்ந்த சிப்பாய்?", "image": imgMangal, "options": ["19-வது காலாட்படை", "34-வது வங்காள உள்நாட்டு காலாட்படை", "20-வது குதிரைப்படை", "40-வது படைப்பிரிவு"], "correct": 1},
      {"question": "Q) புரட்சிக்கு உடனடிக் காரணமாக அமைந்த புதிய துப்பாக்கி எது?", "image": imgEnfield, "options": ["பிரவுன் பெஸ்", "என்பீல்டு துப்பாக்கி (Enfield)", "மேகசின் ரைபிள்", "மவுசர் துப்பாக்கி"], "correct": 1},

    let currentIndex = 0;
    let timerRunning = false;
    let countdown = 5;
    let timerHandle = null;
    let autoNextHandle = null;

    let audioCtx = null;
    function getCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playTick() {
      try {
        const ctx = getCtx();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(850, now);
        osc.frequency.exponentialRampToValueAtTime(150, now + 0.04);
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.04);
      } catch (e) {}
    }

    function playDing() {
      try {
        const ctx = getCtx();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.exponentialRampToValueAtTime(1046, now + 0.08);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.4);
      } catch (e) {}
    }

    function renderScreen() {
      clearTimeout(autoNextHandle);
      clearInterval(timerHandle);
      timerRunning = false;
      countdown = 5;

      const q = quizData[currentIndex];
      document.getElementById('qIndex').textContent = `${String(currentIndex + 1).padStart(2, '0')}/${String(quizData.length).padStart(2, '0')}`;
      document.getElementById('qText').textContent = q.question;
      
      const imgElem = document.getElementById('qImg');
      imgElem.src = q.image;

      document.getElementById('timerVal').textContent = '5';

      const btn = document.getElementById('startBtn');
      btn.disabled = false;
      btn.textContent = '⏱️ டைமர் தொடங்கு (5 விநாடி)';

      for (let i = 0; i < 4; i++) {
        document.getElementById(`optText${i}`).textContent = q.options[i];
        document.getElementById(`optRow${i}`).className = 'opt-box';
        document.getElementById(`tick${i}`).innerHTML = '';
      }
    }

    function startTimer() {
      getCtx();
      if (timerRunning) return;
      timerRunning = true;
      countdown = 5;

      const btn = document.getElementById('startBtn');
      btn.disabled = true;
      btn.textContent = 'நேரம் ஓடுகிறது...';

      playTick();
      document.getElementById('timerVal').textContent = countdown;

      timerHandle = setInterval(() => {
        countdown--;
        if (countdown > 0) {
          playTick();
          document.getElementById('timerVal').textContent = countdown;
        } else {
          clearInterval(timerHandle);
          document.getElementById('timerVal').textContent = '0';
          revealAnswer();
        }
      }, 1000);
    }

    function revealAnswer() {
      playDing();
      const q = quizData[currentIndex];
      const correctIdx = q.correct;

      const row = document.getElementById(`optRow${correctIdx}`);
      row.classList.add('is-correct');
      document.getElementById(`tick${correctIdx}`).innerHTML = '<span class="tick-badge">✔</span>';

      document.getElementById('startBtn').textContent = 'சரியான விடை!';

      autoNextHandle = setTimeout(() => {
        if (currentIndex < quizData.length - 1) {
          currentIndex++;
          renderScreen();
        } else {
          document.getElementById('startBtn').textContent = 'முடிந்தது! 🎉';
        }
      }, 3000);
    }

    function openEditor() {
      document.getElementById('jsonBox').value = JSON.stringify(quizData, null, 2);
      document.getElementById('editorModal').style.display = 'flex';
    }
    function closeEditor() {
      document.getElementById('editorModal').style.display = 'none';
    }
    function saveQuestions() {
      try {
        const parsed = JSON.parse(document.getElementById('jsonBox').value);
        if (Array.isArray(parsed) && parsed.length > 0) {
          quizData = parsed;
          currentIndex = 0;
          closeEditor();
          renderScreen();
        }
      } catch (e) {
        alert('JSON error!');
      }
    }

    window.onload = () => {
      renderScreen();
      document.body.addEventListener('touchstart', getCtx, { once: true });
      document.body.addEventListener('click', getCtx, { once: true });
    };
  </script>
