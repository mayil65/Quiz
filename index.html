<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>LOVE TNPSC - Question Paper Quiz</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link href="https://fonts.googleapis.com/css2?family=Mukta+Malar:wght@600;700;800&family=Teko:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* அசல் வெள்ளை தாள் பின்னணி */
    body, html {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #ffffff !important;
      font-family: 'Mukta Malar', sans-serif;
      color: #0b1536;
    }

    .main-wrapper {
      width: 100%;
      height: 100%;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px 28px;
      position: relative;
    }

    /* மேல் பகுதி - எளிய கேள்வித்தாள் தலைப்பு */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
      border-bottom: 2px solid #e2e8f0;
    }

    .brand-tag {
      font-weight: 800;
      font-size: 14px;
      color: #1e3a8a;
      letter-spacing: 0.5px;
    }

    .btn-edit {
      background: #0f172a;
      color: #ffffff;
      border: none;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    /* கேள்வி வரி - அடர் நீல நிற வினாத்தாள் வடிவம் */
    .question-title {
      font-size: 26px;
      font-weight: 800;
      color: #0b1a78;
      line-height: 1.35;
      margin: 8px 0;
    }

    /* நடுப்பகுதி: இடது ஆப்ஷன்கள், வலது படம் */
    .body-content {
      display: flex;
      flex: 1;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
      margin: 4px 0;
    }

    /* 4 ஆப்ஷன்கள் (a, b, c, d) */
    .options-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1.2;
    }

    .opt-box {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 22px;
      font-weight: 800;
      color: #000000;
      padding: 6px 12px;
      border-radius: 8px;
      transition: all 0.2s ease;
    }

    .opt-char {
      color: #000000;
      font-weight: 800;
      width: 28px;
    }

    /* சரியான விடைக்கு பச்சை நிறம் & டிக் */
    .opt-box.is-correct {
      background-color: #10b981 !important;
      color: #ffffff !important;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
    }
    .opt-box.is-correct span {
      color: #ffffff !important;
    }

    .tick-badge {
      margin-left: auto;
      background: #ffffff;
      color: #059669;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 900;
      animation: popTick 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes popTick {
      0% { transform: scale(0); }
      100% { transform: scale(1); }
    }

    /* படம் இருக்கும் பகுதி */
    .image-group {
      flex: 0.9;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      max-height: 260px;
    }

    .image-group img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.1));
    }

    /* கீழ் பகுதி - தொடங்கு பட்டன் மற்றும் டைமர் */
    .footer-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 8px;
      border-top: 1px solid #f1f5f9;
    }

    .start-btn {
      background: linear-gradient(135deg, #1e3a8a, #0f172a);
      color: #ffffff;
      font-size: 15px;
      font-weight: 800;
      border: none;
      padding: 10px 22px;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    .start-btn:disabled {
      opacity: 0.6;
    }

    /* தங்க நிற வட்ட டைமர் (ஸ்கிரீன்ஷாட்டில் உள்ள வடிவம்) */
    .gold-timer {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fef08a, #ca8a04 60%, #713f12 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(161, 98, 7, 0.4);
      border: 3px solid #fef9c3;
    }

    .timer-num {
      font-family: 'Teko', sans-serif;
      font-size: 36px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    /* அப்லோட் மாடல் */
    .modal-wrap {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-card {
      background: #ffffff;
      border-radius: 12px;
      padding: 18px;
      width: 90%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .modal-card textarea {
      width: 100%;
      height: 160px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 8px;
      font-size: 12px;
      font-family: monospace;
    }
  </style>
</head>
<body>

  <div class="main-wrapper">

    <!-- Header -->
    <div class="header-bar">
      <span class="brand-tag">LOVE TNPSC | <span id="qIndex" style="color: #64748b;">கேள்வி 01/02</span></span>
      <button class="btn-edit" onclick="openEditor()">➕ கேள்விகள் மாற்று</button>
    </div>

    <!-- Question -->
    <h1 id="qText" class="question-title">
      Q) சிப்ஸ் பையில் எந்த வாயு நிரப்பப்படுகிறது?
    </h1>

    <!-- Center: Options (Left) & Image (Right) -->
    <div class="body-content">
      
      <div class="options-group">
        <div id="optRow0" class="opt-box">
          <span class="opt-char">a)</span>
          <span id="optText0">நைட்ரஜன்</span>
          <div id="tick0"></div>
        </div>
        <div id="optRow1" class="opt-box">
          <span class="opt-char">b)</span>
          <span id="optText1">ஹைட்ரஜன்</span>
          <div id="tick1"></div>
        </div>
        <div id="optRow2" class="opt-box">
          <span class="opt-char">c)</span>
          <span id="optText2">ஆக்சிஜன்</span>
          <div id="tick2"></div>
        </div>
        <div id="optRow3" class="opt-box">
          <span class="opt-char">d)</span>
          <span id="optText3">ஆர்கான்</span>
          <div id="tick3"></div>
        </div>
      </div>

      <div class="image-group">
        <img id="qImg" src="" alt="Quiz Image">
      </div>

    </div>

    <!-- Bottom Footer -->
    <div class="footer-bar">
      <button id="startBtn" class="start-btn" onclick="startTimer()">
        ⏱️ டைமர் தொடங்கு (5 விநாடி)
      </button>

      <div class="gold-timer">
        <span id="timerVal" class="timer-num">5</span>
      </div>
    </div>

  </div>

  <!-- Modal for Bulk Upload -->
  <div id="editorModal" class="modal-wrap">
    <div class="modal-card">
      <h3 style="font-size: 15px; font-weight: 800; color: #0b1a78;">புதிய கேள்விகள் & படங்கள் உள்ளிடவும்:</h3>
      <textarea id="jsonBox"></textarea>
      <div style="display: flex; gap: 8px; justify-content: flex-end;">
        <button style="padding: 6px 14px; border: none; background: #e2e8f0; border-radius: 6px; font-weight: 700; cursor: pointer;" onclick="closeEditor()">ரத்து</button>
        <button style="padding: 6px 14px; border: none; background: #10b981; color: #fff; border-radius: 6px; font-weight: 700; cursor: pointer;" onclick="saveQuestions()">சேமி & இயக்கு</button>
      </div>
    </div>
  </div>

  <script>
    // இன்டர்நெட் இல்லாவிட்டாலும் உடனே தோன்றும் தெளிவான வெக்டார் சிப்ஸ் படம்
    const chipsImg = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 320 280'><defs><linearGradient id='gY' x1='0' y1='0' x2='1' y2='1'><stop offset='0%25' stop-color='%23fef08a'/><stop offset='100%25' stop-color='%23eab308'/></linearGradient><linearGradient id='gB' x1='0' y1='0' x2='1' y2='1'><stop offset='0%25' stop-color='%2338bdf8'/><stop offset='100%25' stop-color='%230284c7'/></linearGradient></defs><rect x='25' y='20' width='110' height='170' rx='16' fill='url(%23gY)' stroke='%23ca8a04' stroke-width='3'/><circle cx='80' cy='105' r='30' fill='%23ef4444'/><text x='80' y='110' font-size='15' font-family='sans-serif' font-weight='900' fill='white' text-anchor='middle'>CHIPS</text><rect x='110' y='60' width='140' height='200' rx='20' fill='url(%23gB)' stroke='%230369a1' stroke-width='4'/><circle cx='180' cy='160' r='42' fill='%23e11d48'/><text x='180' y='166' font-size='22' font-family='sans-serif' font-weight='900' fill='white' text-anchor='middle'>CHIPS</text></svg>";

    const googleImg = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 120'><text x='50%25' y='65%25' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-weight='bold' font-size='56'><tspan fill='%234285F4'>G</tspan><tspan fill='%23EA4335'>o</tspan><tspan fill='%23FBBC05'>o</tspan><tspan fill='%234285F4'>g</tspan><tspan fill='%2334A853'>l</tspan><tspan fill='%23EA4335'>e</tspan></text></svg>";

    let quizData = [
      {
        question: "Q) சிப்ஸ் பையில் எந்த வாயு நிரப்பப்படுகிறது?",
        image: chipsImg,
        options: ["நைட்ரஜன்", "ஹைட்ரஜன்", "ஆக்சிஜன்", "ஆர்கான்"],
        correct: 0
      },
      {
        question: "Q) கூகுள் (Google) எந்த நாட்டின் நிறுவனம்?",
        image: googleImg,
        options: ["இந்தியா", "அமெரிக்கா", "ஜப்பான்", "சீனா"],
        correct: 1
      }
    ];

    let currentIndex = 0;
    let timerRunning = false;
    let countdown = 5;
    let timerHandle = null;
    let autoNextHandle = null;

    let audioCtx = null;
    function getCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playTick() {
      try {
        const ctx = getCtx();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(850, now);
        osc.frequency.exponentialRampToValueAtTime(150, now + 0.04);
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.04);
      } catch (e) {}
    }

    function playDing() {
      try {
        const ctx = getCtx();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.exponentialRampToValueAtTime(1046, now + 0.08);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.4);
      } catch (e) {}
    }

    function renderScreen() {
      clearTimeout(autoNextHandle);
      clearInterval(timerHandle);
      timerRunning = false;
      countdown = 5;

      const q = quizData[currentIndex];
      document.getElementById('qIndex').textContent = `கேள்வி ${String(currentIndex + 1).padStart(2, '0')}/${String(quizData.length).padStart(2, '0')}`;
      document.getElementById('qText').textContent = q.question;
      document.getElementById('qImg').src = q.image;
      document.getElementById('timerVal').textContent = '5';

      const btn = document.getElementById('startBtn');
      btn.disabled = false;
      btn.textContent = '⏱️ டைமர் தொடங்கு (5 விநாடி)';

      for (let i = 0; i < 4; i++) {
        document.getElementById(`optText${i}`).textContent = q.options[i];
        document.getElementById(`optRow${i}`).className = 'opt-box';
        document.getElementById(`tick${i}`).innerHTML = '';
      }
    }

    function startTimer() {
      getCtx();
      if (timerRunning) return;
      timerRunning = true;
      countdown = 5;

      const btn = document.getElementById('startBtn');
      btn.disabled = true;
      btn.textContent = 'நேரம் ஓடுகிறது...';

      playTick();
      document.getElementById('timerVal').textContent = countdown;

      timerHandle = setInterval(() => {
        countdown--;
        if (countdown > 0) {
          playTick();
          document.getElementById('timerVal').textContent = countdown;
        } else {
          clearInterval(timerHandle);
          document.getElementById('timerVal').textContent = '0';
          revealAnswer();
        }
      }, 1000);
    }

    function revealAnswer() {
      playDing();
      const q = quizData[currentIndex];
      const correctIdx = q.correct;

      const row = document.getElementById(`optRow${correctIdx}`);
      row.classList.add('is-correct');
      document.getElementById(`tick${correctIdx}`).innerHTML = '<span class="tick-badge">✔</span>';

      document.getElementById('startBtn').textContent = 'சரியான விடை!';

      autoNextHandle = setTimeout(() => {
        if (currentIndex < quizData.length - 1) {
          currentIndex++;
          renderScreen();
        } else {
          document.getElementById('startBtn').textContent = 'அனைத்து கேள்விகளும் முடிந்தது! 🎉';
        }
      }, 3000);
    }

    function openEditor() {
      document.getElementById('jsonBox').value = JSON.stringify(quizData, null, 2);
      document.getElementById('editorModal').style.display = 'flex';
    }
    function closeEditor() {
      document.getElementById('editorModal').style.display = 'none';
    }
    function saveQuestions() {
      try {
        const parsed = JSON.parse(document.getElementById('jsonBox').value);
        if (Array.isArray(parsed) && parsed.length > 0) {
          quizData = parsed;
          currentIndex = 0;
          closeEditor();
          renderScreen();
        }
      } catch (e) {
        alert('JSON-ல் பிழை உள்ளது! சரிபார்க்கவும்.');
      }
    }

    window.onload = () => {
      renderScreen();
      document.body.addEventListener('touchstart', getCtx, { once: true });
      document.body.addEventListener('click', getCtx, { once: true });
    };
  </script>
</body>
</html>
