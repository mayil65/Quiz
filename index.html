<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LOVE TNPSC - White Paper Quiz</title>
  <link href="https://fonts.googleapis.com/css2?family=Mukta+Malar:wght@600;700;800&family=Teko:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #ffffff !important;
      font-family: 'Mukta Malar', sans-serif;
    }

    .main-screen {
      width: 100%;
      height: 100%;
      background: #ffffff;
      padding: 24px 36px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    /* Question Title - Dark Blue Question Paper Style */
    .question-line {
      font-size: 30px;
      font-weight: 800;
      color: #0b1a78;
      line-height: 1.3;
    }

    /* Content Area */
    .content-box {
      display: flex;
      flex: 1;
      align-items: center;
      justify-content: space-between;
      gap: 40px;
      margin: 10px 0;
    }

    /* Options List on Left */
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 18px;
      flex: 1.2;
    }

    .opt-item {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 24px;
      font-weight: 800;
      color: #000000;
      padding: 6px 14px;
      border-radius: 8px;
    }

    .opt-item.active-correct {
      background-color: #10b981 !important;
      color: #ffffff !important;
    }

    .opt-item.active-correct span {
      color: #ffffff !important;
    }

    .tick-box {
      margin-left: auto;
      background: #ffffff;
      color: #059669;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 900;
    }

    /* Image on Right */
    .image-box {
      flex: 0.9;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      max-height: 280px;
    }

    .image-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    /* Bottom Control Bar */
    .footer-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 10px;
    }

    .action-btn {
      background: #0f172a;
      color: #ffffff;
      font-size: 15px;
      font-weight: 800;
      border: none;
      padding: 10px 22px;
      border-radius: 8px;
      cursor: pointer;
    }

    /* Golden Circle Timer Bottom Right */
    .timer-badge {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fef08a, #ca8a04 60%, #713f12 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(161, 98, 7, 0.4);
      border: 3px solid #fef9c3;
    }

    .timer-badge span {
      font-family: 'Teko', sans-serif;
      font-size: 38px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <div class="main-screen">

    <!-- Top Question -->
    <h1 id="qTitle" class="question-line">
      Q) சிப்ஸ் பையில் எந்த வாயு நிரப்பப்படுகிறது?
    </h1>

    <!-- Middle: Options + Image -->
    <div class="content-box">
      
      <!-- Left: a, b, c, d options -->
      <div class="options-list">
        <div id="optRow0" class="opt-item">
          <span>a)</span>
          <span id="optText0">நைட்ரஜன்</span>
          <div id="tick0"></div>
        </div>
        <div id="optRow1" class="opt-item">
          <span>b)</span>
          <span id="optText1">ஹைட்ரஜன்</span>
          <div id="tick1"></div>
        </div>
        <div id="optRow2" class="opt-item">
          <span>c)</span>
          <span id="optText2">ஆக்சிஜன்</span>
          <div id="tick2"></div>
        </div>
        <div id="optRow3" class="opt-item">
          <span>d)</span>
          <span id="optText3">ஆர்கான்</span>
          <div id="tick3"></div>
        </div>
      </div>

      <!-- Right: Image -->
      <div class="image-box">
        <img id="qImg" src="" alt="Quiz Image">
      </div>

    </div>

    <!-- Bottom: Start Button + Timer -->
    <div class="footer-bar">
      <button id="startBtn" class="action-btn" onclick="startTimer()">
        ⏱️ டைமர் தொடங்கு (5 விநாடி)
      </button>

      <div class="timer-badge">
        <span id="timerVal">5</span>
      </div>
    </div>

  </div>

  <script>
    // Built-in Crisp Vector Images (Network load aakathirikkilla)
    const chipsSvg = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 320 280'><defs><linearGradient id='gY' x1='0' y1='0' x2='1' y2='1'><stop offset='0%25' stop-color='%23fde047'/><stop offset='100%25' stop-color='%23eab308'/></linearGradient><linearGradient id='gB' x1='0' y1='0' x2='1' y2='1'><stop offset='0%25' stop-color='%2338bdf8'/><stop offset='100%25' stop-color='%230284c7'/></linearGradient></defs><rect x='25' y='20' width='110' height='170' rx='16' fill='url(%23gY)' stroke='%23ca8a04' stroke-width='3'/><circle cx='80' cy='105' r='30' fill='%23ef4444'/><text x='80' y='110' font-size='15' font-family='sans-serif' font-weight='900' fill='white' text-anchor='middle'>CHIPS</text><rect x='110' y='60' width='140' height='200' rx='20' fill='url(%23gB)' stroke='%230369a1' stroke-width='4'/><circle cx='180' cy='160' r='42' fill='%23e11d48'/><text x='180' y='166' font-size='22' font-family='sans-serif' font-weight='900' fill='white' text-anchor='middle'>CHIPS</text></svg>";

    const questions = [
      {
        question: "Q) சிப்ஸ் பையில் எந்த வாயு நிரப்பப்படுகிறது?",
        image: chipsSvg,
        options: ["நைட்ரஜன்", "ஹைட்ரஜன்", "ஆக்சிஜன்", "ஆர்கான்"],
        correct: 0
      }
    ];

    let current = 0;
    let timerRunning = false;
    let count = 5;
    let timerId = null;

    let audioCtx = null;
    function getCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playTick() {
      try {
        const ctx = getCtx();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(850, now);
        osc.frequency.exponentialRampToValueAtTime(150, now + 0.04);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.04);
      } catch (e) {}
    }

    function playDing() {
      try {
        const ctx = getCtx();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.exponentialRampToValueAtTime(1046, now + 0.08);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.4);
      } catch (e) {}
    }

    function render() {
      const q = questions[current];
      document.getElementById('qTitle').textContent = q.question;
      document.getElementById('qImg').src = q.image;
      document.getElementById('timerVal').textContent = '5';

      for (let i = 0; i < 4; i++) {
        document.getElementById(`optText${i}`).textContent = q.options[i];
        document.getElementById(`optRow${i}`).className = 'opt-item';
        document.getElementById(`tick${i}`).innerHTML = '';
      }
    }

    function startTimer() {
      getCtx();
      if (timerRunning) return;
      timerRunning = true;
      count = 5;

      const btn = document.getElementById('startBtn');
      btn.disabled = true;
      btn.textContent = 'நேரம் ஓடுகிறது...';

      playTick();
      document.getElementById('timerVal').textContent = count;

      timerId = setInterval(() => {
        count--;
        if (count > 0) {
          playTick();
          document.getElementById('timerVal').textContent = count;
        } else {
          clearInterval(timerId);
          document.getElementById('timerVal').textContent = '0';
          reveal();
        }
      }, 1000);
    }

    function reveal() {
      playDing();
      const q = questions[current];
      const correctIdx = q.correct;

      const row = document.getElementById(`optRow${correctIdx}`);
      row.classList.add('active-correct');
      document.getElementById(`tick${correctIdx}`).innerHTML = '<span class="tick-box">✔</span>';

      document.getElementById('startBtn').textContent = 'சரியான விடை!';
    }

    window.onload = () => {
      render();
      document.body.addEventListener('touchstart', getCtx, { once: true });
      document.body.addEventListener('click', getCtx, { once: true });
    };
  </script>
</body>
</html>
